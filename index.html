<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SofiMovies — Catálogo de películas y series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/styles.css">
<link rel="stylesheet" href="styles/views.css">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header" id="siteHeader">
    <a href="#" class="logo" id="logo">Sofi<span>Movies</span></a>

    <form class="search-bar" id="searchBar" role="search">
      <svg class="search-bar__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="16.4" y1="16.4" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input type="search" class="search-bar__input" id="searchInput" placeholder="Buscar películas o series..." aria-label="Buscar películas o series">
      <button type="button" class="search-bar__close" id="searchClose" aria-label="Cerrar búsqueda">✕</button>
    </form>

    <nav class="main-nav" id="mainNav">
      <a href="#" class="nav-link is-active" id="navHome">Inicio</a>
      <a href="#trends" class="nav-link" id="navMovies">Películas</a>
      <a href="#" class="nav-link" id="navSeries">Series</a>
    </nav>


    <div class="header-actions" id="headerActions">
      <button class="icon-btn" id="searchToggle" aria-label="Buscar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.4" y1="16.4" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>

    <!-- HERO -->
    <section class="hero inactive" id="hero" aria-label="Destacado">
    <div class="hero__media" id="heroMedia" style="--poster-a:#3a1264; --poster-b:#b565f5;">
        <span class="hero__badge" id="heroBadge">Estreno</span>
    </div>
    <div class="hero__info" id="heroInfo">
        <p class="hero__eyebrow" id="heroEyebrow">Película destacada</p>
        <h1 class="hero__title" id="heroTitle">El Último Fotograma</h1>
        <p class="hero__meta" id="heroMeta">2026 · Thriller · 2h 08m</p>
        <div class="hero__actions" id="heroActions">
        <button class="btn btn--primary" id="heroPlayBtn">▶ Ver ahora</button>
        <button class="btn btn--ghost" id="heroListBtn">+ Mi lista</button>
        </div>
    </div>
    </section>

    <div class="reel-divider" role="presentation"></div>

    <!-- TENDENCIAS -->
    <section id="trendingPreview" class="shelf inactive" aria-label="Tendencias">
      <div class="shelf__head" id="trendingHead">
        <h2 class="shelf__title" id="trendingTitle">Tendencias</h2>
        <button type="button" class="shelf__link" id="trendingLink" >Ver todo</button>
      </div>

      <div class="shelf__track" id="trendingTrack">
      </div>
    </section>

    <div class="reel-divider" role="presentation"></div>

    <!-- CATEGORIAS -->
    <section class="categories inactive" id="categories" aria-label="Categorías">
        <div class="shelf__head" id="categoriesHead">
            <h2 class="section-title" id="categoriesTitle">Categorías</h2>
            <button type="button" class="shelf__link" id="categoriesLink"></button>

        </div>
      

      <div class="categories__grid" id="categoriesGrid">

      </div>
    </section>

    <!-- SIMILARES -->
    <section class="shelf inactive" id="similarMovies" aria-label="Similares">
      <div class="shelf__head" id="similarHead">
        <h2 class="shelf__title" id="similarTitle">Similares</h2>
        <button type="button" class="shelf__link" id="similarLink" >Ver todo</button>
      </div>

      <div class="shelf__track" id="similarTrack">
      </div>
    </section>

    <!-- DETALLE DE PELICULA (#movie=ID) -->
    <section class="movie-view inactive" id="movieView" aria-label="Detalle de película">
      <div class="movie-view__backdrop" id="movieBackdrop">
        <button type="button" class="movie-view__back" id="movieBackBtn" aria-label="Volver">←</button>
        <img class="movie-view__backdrop-img" id="movieBackdropImg" alt="">
      </div>

      <div class="movie-view__card" id="movieCard">
        <div class="movie-view__head" id="movieHead">
          <h1 class="movie-view__title" id="movieTitle"></h1>
          <span class="movie-view__rating" id="movieRating">★ 0.0</span>
        </div>
        <p class="movie-view__overview" id="movieOverview"></p>
        <div class="movie-view__genres" id="movieGenres"></div>
      </div>

    <section class="shelf" aria-label="Recomendaciones" id="movieRecommendationsShelf">
      <div class="shelf__head" id="movieRecommendationsHead">
        <h2 class="shelf__title">Recomendaciones</h2>
      </div>
      <div class="shelf__track" id="movieRecommendationsTrack"></div>
    </section>
    </section>

    <!-- CATEGORIA (#category=ID) -->
    <section class="category-view inactive" id="categoryView" aria-label="Categoría">
      <div class="category-view__head" id="categoryHead">
        <h1 class="category-view__title" id="categoryTitle"></h1>
        <button class="shelf__link" onclick="goBack()">Volver</button>

      </div>
      <div class="category-view__grid" id="categoryGrid"></div>
    </section>

    <!-- TENDENCIAS COMPLETAS (#trends) -->
    <section class="trends-view inactive" id="trendsView" aria-label="Todas las tendencias">
      <div class="trends-view__head" id="trendsHead">
        <h1 class="trends-view__title">Tendencias</h1>
        <button class="shelf__link" onclick="goBack()">Volver</button>
      </div>
      <div class="trends-view__grid" id="trendsGrid"></div>
    </section>

    <!-- BUSQUEDA (#search=QUERY) -->
    <section class="search-view inactive" id="searchView" aria-label="Resultados de búsqueda">
      <div class="search-view__head" id="searchHead">
        <h1 class="search-view__title" id="searchResultsTitle"></h1>
        <button class="shelf__link" onclick="goBack()">Volver</button>

      </div>
      <div class="search-view__grid" id="searchGrid"></div>
    </section>

  </main>

  <div class="reel-divider" role="presentation"></div>

  <!-- FOOTER -->
  <footer class="site-footer" id="siteFooter">
    <p id="footerText">&copy; 2026 SofiMovies. Todos los derechos reservados.</p>
  </footer>

  <script>
    const navToggle = document.getElementById('navToggle');
    const mainNav = document.getElementById('mainNav');
    navToggle.addEventListener('click', () => {
      const isOpen = mainNav.classList.toggle('is-open');
      navToggle.classList.toggle('is-open', isOpen);
      navToggle.setAttribute('aria-expanded', isOpen);
    });

    const searchToggle = document.getElementById('searchToggle');
    const searchBar = document.getElementById('searchBar');
    const searchClose = document.getElementById('searchClose');
    const searchInput = searchBar.querySelector('.search-bar__input');

    function openSearch(){
      searchBar.classList.add('is-open');
      mainNav.classList.remove('is-open');
      navToggle.classList.remove('is-open');
      navToggle.setAttribute('aria-expanded', false);
      searchInput.focus();
    }
    function closeSearch(){
      searchBar.classList.remove('is-open');
    }

    searchToggle.addEventListener('click', openSearch);
    searchClose.addEventListener('click', closeSearch);
    searchBar.addEventListener('submit', (e) => {
      e.preventDefault();
      const query = searchInput.value.trim();
      if (query) {
        location.hash = `#search=${encodeURIComponent(query)}`;
        closeSearch();
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="src/secrets.js"></script>
  <script src="src/nodes.js"></script>
  <script src="src/main.js"></script>
  <script src="src/navigation.js"></script>
</body>
</html>
